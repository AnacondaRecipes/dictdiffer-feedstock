{% set name = "dictdiffer" %}
{% set version = "0.10.0" %}
{% set sha256 = "0b912acf663949d73b820d3ed59362140a188ab742c94efe13c762dbd24cbbd3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv

requirements:
  host:
    - pip
    - python
    - pytest-runner >=2.7
    - setuptools_scm >=3.1
    - hatch-vcs
    - hatchling
  run:
    - python
  run_constrained:
    - numpy >=1.20.0

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - dictdiffer

about:
  home: https://github.com/inveniosoftware/dictdiffer
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Dictdiffer is a helper module that helps you to diff and patch dictionaries.
  description: |
    Dictdiffer is a helper module that helps you to diff and patch dictionaries.
  doc_url: https://dictdiffer.readthedocs.io
  dev_url: https://github.com/inveniosoftware/dictdiffer

extra:
  recipe-maintainers:
    - hodgsonw
    - kmuehlbauer
